[project]
name = "jira-task-service"
version = "0.2.0"
description = "Turns meeting action items (or raw transcripts) into Jira tasks, idempotently"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.35,<1",
    "httpx>=0.28,<1",
    "google-genai>=1.30,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
]

[project.scripts]
jira-task-service = "jira_service.api:main"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]  # B008: FastAPI's Depends()/Header() defaults are idiomatic

[tool.ruff.lint.isort]
known-first-party = ["jira_service"]
